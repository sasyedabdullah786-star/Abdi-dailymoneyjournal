<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>
  <!-- Background with smooth rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="24" y="24" width="464" height="464" rx="104" stroke="#334155" stroke-width="8" stroke-dasharray="16 16" opacity="0.4" />
  
  <!-- Journal Book Container -->
  <rect x="110" y="90" width="292" height="332" rx="36" fill="#1e293b" stroke="#475569" stroke-width="8" />
  <!-- Spine -->
  <rect x="110" y="90" width="48" height="332" rx="24" fill="#0f172a" />
  <line x1="158" y1="90" x2="158" y2="422" stroke="#334155" stroke-width="4" />
  
  <!-- Financial Emblem / Rupee & Growth Symbol -->
  <circle cx="280" cy="230" r="76" fill="url(#goldGrad)" filter="drop-shadow(0px 12px 24px rgba(16, 185, 129, 0.35))" />
  
  <!-- Currency Symbol ₹ -->
  <path d="M256 195 H304 M256 215 H296 M256 195 V255 M274 215 C290 215 296 226 296 236 C296 248 286 256 270 256 H260 L298 290" 
        stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Trending upwards arrow badge -->
  <circle cx="340" cy="330" r="32" fill="url(#shieldGrad)" />
  <path d="M328 336 L338 326 M338 326 H330 M338 326 V334" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Daily ledger lines -->
  <line x1="184" y1="335" x2="280" y2="335" stroke="#64748b" stroke-width="6" stroke-linecap="round" />
  <line x1="184" y1="365" x2="310" y2="365" stroke="#475569" stroke-width="6" stroke-linecap="round" />
</svg>
